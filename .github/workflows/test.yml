name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      # Install the exact ruff pinned in requirements_test.txt, rather than
      # repeating the version here, so local and CI cannot drift apart and a
      # Dependabot bump to that file updates CI in the same PR.
      - name: Install ruff (version from requirements_test.txt)
        run: |
          pin=$(grep -E '^ruff==' requirements_test.txt)
          if [ -z "$pin" ]; then
            echo "No pinned 'ruff==' line found in requirements_test.txt" >&2
            exit 1
          fi
          echo "Installing $pin"
          pip install "$pin"
      - run: ruff check .

  pytest:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The declared minimum (hacs.json) and the latest. Each PHACC release
          # pins one exact Home Assistant version, so pinning PHACC pins HA.
          # The minimum is pinned here and never moves. The latest is pinned in
          # requirements_ha_latest.txt, which Dependabot keeps current. Each
          # job's Python must satisfy its PHACC's floor (Home Assistant 2026.5+
          # needs 3.14).
          - name: "HA 2025.4 (minimum)"
            python: "3.13"
            phacc: "pytest-homeassistant-custom-component==0.13.236"   # HA 2025.4.4
          - name: "HA latest"
            python: "3.14"
            phacc: "-r requirements_ha_latest.txt"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install test dependencies
        run: |
          # Pin PHACC (and therefore Home Assistant) first; requirements_test
          # then adds the test tools without upgrading it.
          pip install ${{ matrix.phacc }}
          pip install -r requirements_test.txt

      - name: Run tests
        # Gate on coverage. Start low while the integration is scaffolded and
        # ratchet it up as platforms land.
        run: >-
          pytest --cov=custom_components.grandstream_phone --cov-report=term-missing
          --cov-fail-under=80
